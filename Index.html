<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatehMight | Hub</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-bottom: 50px;
        }

        /* Banner Style */
        .banner {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-bottom: 3px solid #25D366;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { font-size: 1.8rem; margin: 10px 0; letter-spacing: 2px; text-align: center; }
        
        .links-container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            border-radius: 12px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn:active { transform: scale(0.95); }
        
        .youtube { background-color: #FF0000; }
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .whatsapp-channel { background-color: #25D366; }
        
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>

        <a href="https://whatsapp.com/channel/0029VarsfOSGE56fp8hYeq2X" class="btn whatsapp-channel" target="_blank">Mera WhatsApp Channel</a>
