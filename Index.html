            align-items: center;
            justify-content: center;

        h1 { margin-bottom: 30px; }

            width: 90%;
            max-width: 400px;

        }
        .btn {

        .btn:active { transform: scale(0.95); }

        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
